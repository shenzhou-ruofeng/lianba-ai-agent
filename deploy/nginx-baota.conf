# ============================================================
# 宝塔面板站点 Nginx 配置片段
# 使用方法：宝塔 -> 网站 -> 你的站点 -> 设置 -> 配置文件
# 把下面 location 块粘贴到 server { } 内（放在默认 location / 之前或替换之）
# ============================================================

# 前端 Vue 路由支持（history 模式刷新不 404）
location / {
    try_files $uri $uri/ /index.html;
}

# API 反向代理到后端（后端 jar 监听 127.0.0.1:8123，context-path 为 /api）
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8123/api/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE 流式输出必须的配置（否则 AI 回复不能流式显示/直接断开）
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;

    # RAG 文档解析为同步长任务，超时放大到 600s
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # 上传文档/图片大小限制（需 >= 后端 spring 配置的上传限制）
    client_max_body_size 50m;
}

# 静态资源缓存
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public";
}
